name: ml-ci

on:
  push:
  pull_request:

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r ml-engine/requirements.txt
      - run: cd ml-engine && python -m pytest tests
